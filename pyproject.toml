modules = []
status = "rejected"
reason = "**这是「边界最难处理」在行业里的标准答案，而 SQLite 没有等价物**：PostgreSQL 的行级安全策略把「只能看到本团队的行」写成数据库策略，应用层漏写一个 where 也拿不到别人的数据——隔离从「每个入口都要记得」变成「库强制」。不用的理由只有一条，但很硬：本项目是单机私有化交付（一个进程 + 一个 SQLite 文件），引入 PostgreSQL 等于把部署从「拷一个目录」变成「装一个数据库服务」，与产品形态冲突。退而求其次的是 F1 选的替代：归属过滤写进 SQL，且所有权参数**无默认值**（`insert_message(conn, owner, ...)`——少传一个是 TypeError，不是漏过滤），代价是它靠签名与测试保证，不靠库强制。重开条件：产品转向多租户 SaaS（一个实例服务多个客户）、或客户环境已有 PostgreSQL 并要求等保级隔离审计时，这一条从 rejected 直接翻成必选——届时 65 处仓储里的 where 可以整体撤掉换成策略。"


[project.optional-dependencies]
# 版本写死，不用范围。范围迟早会解析出两个不同的环境，而"我这能跑"是最烧时间的 bug。
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "import-linter==2.15",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pre-commit==4.7.0",
    "deptry==0.25.1",
    "pip-audit==2.10.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────
# 规则源：ruff 是「代码规范」的唯一执行点。
# 改这一段等于改规范，改规范要写明理由（tests/test_gates.py 会盯住它）。
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
# 目录级豁免只有两处，都是外部代码：
#   evals/self/        —— 从 C# 仓库原样搬来的 5 个评测脚本，要能逐字节对账
#   evals/public/rgb   —— RGB 基准官方实现，原样保留，不改
# 自己写的代码永远不在这里，test_gates 会盯住。
extend-exclude = ["evals/self", "evals/public/rgb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PGH", "S", "RUF", "ASYNC", "T20"]
# RUF001/002/003：中文文档与注释里全角标点（：，、）是正确写法，不是"歧义字符"。
# 关掉它们是因为规则假设了英文语境，不是因为我们想少检查。
ignore = ["RUF001", "RUF002", "RUF003"]

# 豁免必须写明归属，不允许全局关规则。
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]              # 测试里 assert 是断言，不是安全风险
"scripts/*" = ["S603", "S607", "T20"]  # CI 脚本本来就要调外部命令并打印
"evals/*" = ["T20", "S603"]       # print 是 CLI 的输出方式；subprocess 只调本仓脚本、无 shell
"evals/run_rag_eval_v2.py" = ["T20", "S608"]  # vendored 副本（与 self 原版只差题库路径），豁免随原件
"src/agentworkbench/cli.py" = ["T20"]  # CLI 的启动横幅就该打在 stdout 上——uvicorn 自己也这么干

# ─────────────────────────────────────────────────────────────
# 类型：mypy 是唯一的类型裁决者。不要在编辑器里再挂一个 pyright 当闸门。
# ─────────────────────────────────────────────────────────────
[tool.mypy]
files = ["src", "evals", "tests"]
mypy_path = "src"
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# evals/self/ 是原样搬迁的评测脚本，39 条类型错误全在第三方代码里。
# 类型检查的价值在于「改的时候被拦」，不改的代码被拦一次就够了。
# run_rag_eval_v2.py 是 self 原件的副本（只差题库路径），豁免口径随原件。
exclude = ["^evals/self/", "^evals/public/rgb/", "^evals/run_rag_eval_v2.py"]

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

# ─────────────────────────────────────────────────────────────
# 依赖边界：这里是 pyproject 版的 ProjectReference。
# layers 从上到下 = 上层可依赖下层；同一行用 | 分隔的包彼此独立。
# ─────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["agentworkbench"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层：api → 编排 → 能力 → 基础设施 → core"
type = "layers"
# guard 在能力层（2026-11-02 调整）：F3 的四段编排（agent.runner）要调判定、
# 否决、引用校验——编排层调能力层，方向与 C# AgentHarness → Knowledge.Local 一致。
# 原分层把 guard 与 agent 同层（F2 时 guard 还是空骨架，未考虑编排）。
layers = [
    "agentworkbench.api",
    "agentworkbench.agent | agentworkbench.chat | agentworkbench.ingest | agentworkbench.identity",
    "agentworkbench.rag | agentworkbench.guard | agentworkbench.trace",
    "agentworkbench.db | agentworkbench.llm",
    "agentworkbench.core | agentworkbench.config",
]

[[tool.importlinter.contracts]]
name = "identity 内部分层：编排 → 存储/凭证 → 纯函数"
type = "layers"
# 这个包是**纵向**切的（2026-11-04 定）。别的域按层横向散在 core / db / api 里；
# identity 横切每一个请求，所以让「一个域一个目录」读完。
#
# 包内仍然单向。反过来的例子与代价：
# - policy import store → 判定没法在无库环境里测，而那正是它存在的理由
#   （F1 的判定要能对着一堆构造出来的 User/Session 跑，不建库）。
# - store import policy → 「能不能」和「有没有」混在一层，SQL 里出现 if 分支，
#   而 SQL 里的分支是测试最难覆盖的那种。
layers = [
    "agentworkbench.identity.service",
    "agentworkbench.identity.store | agentworkbench.identity.credentials",
    # sessions 与 policy 同层：两者都只依赖 models，谁也不该 import 对方。
    # 放进同一层是为了让「service 可以用它、它不能反过来调 service」成为被检查的事实。
    "agentworkbench.identity.policy | agentworkbench.identity.sessions",
    "agentworkbench.identity.models",
]

[[tool.importlinter.contracts]]
name = "identity.policy 与 models 是叶子：不碰 IO、不碰第三方"
type = "forbidden"
# 2026-11-04 补这条，因为改坏验证抓出一个洞：外层 layers 只能管到「包」这一级，
# identity 整体在 db 之上，于是 `policy` import `db.engine` 是合法的——
# 而 policy 的整个存在理由就是「不建库也能测判定」。
# 包的层级管不到模块级，只能单独禁一次。
#
# forbidden 里列 sqlite3 而不是只列 agentworkbench.db：直接 `import sqlite3`
# 同样会让判定离不开环境，而且更隐蔽。
source_modules = [
    "agentworkbench.identity.policy",
    "agentworkbench.identity.models",
]
forbidden_modules = [
    "agentworkbench.db",
    "agentworkbench.llm",
    "agentworkbench.api",
    "agentworkbench.agent",
    "agentworkbench.chat",
    "agentworkbench.trace",
    "agentworkbench.rag",
    "agentworkbench.guard",
    "agentworkbench.ingest",
    "sqlite3",
    "fastapi",
    "starlette",
    "pydantic",
    "pwdlib",
]

[[tool.importlinter.contracts]]
name = "core 不依赖任何其他包"
type = "forbidden"
source_modules = ["agentworkbench.core"]
forbidden_modules = [
    "agentworkbench.api",
    "agentworkbench.agent",
    "agentworkbench.chat",
    "agentworkbench.ingest",
    "agentworkbench.guard",
    "agentworkbench.rag",
    "agentworkbench.trace",
    "agentworkbench.db",
    "agentworkbench.llm",
]

[[tool.importlinter.contracts]]
name = "core 只用标准库，不 import 任何第三方"
type = "forbidden"
source_modules = ["agentworkbench.core"]
# 逐项列出，不用通配：通配会把以后新加的库一并禁掉，看起来更严，实际是没人再改它。
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "chonkie",
    "pypdf",
    "openai",
    "httpx",
    "structlog",
    "huey",
    "sse_starlette",
    "tenacity",
    "sqlite_vec",
]

# ─────────────────────────────────────────────────────────────
# 测试
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "invariant: 一条不变量的验证——被改坏时必须变红",
    "slow: 单条超过 1 秒",
    "eval: 需要题库与指标，不进日常 CI",
]

# ─────────────────────────────────────────────────────────────
# 依赖卫生
# ─────────────────────────────────────────────────────────────
# 双向校验：import 了没声明 → DEP001；声明了没 import → DEP002。
# 这条就是「不许自己搓」的部分机械保证：手写了本该调库的代码，声明的依赖会变空转。
[tool.deptry]
extend_exclude = [
    "evals/self",     # vendored，原样搬迁
    "evals/public",   # 外部基准，原样保留
    "evals/spikes",   # 一次性探针，不进 CI
]

[tool.deptry.per_rule_ignores]
# 自引用不是"传递依赖"问题：`agentworkbench.*` 就是本仓自己的包。
DEP003 = ["agentworkbench"]
# dev 工具是「跑的工具」，本来就不该被业务代码 import，不是未使用依赖。
DEP002 = [
    "ruff",
    "mypy",
    "import-linter",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pre-commit",
    "deptry",
    "pip-audit",
    "uvicorn",  # ASGI 运行时：`uvicorn agentworkbench.api.app:app` 启动，不进业务代码
    "python-multipart",  # fastapi 的 multipart 解析在其内部 import，本仓源码里看不到
]
