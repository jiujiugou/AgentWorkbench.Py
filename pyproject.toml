# ── 2026-11-04 补：Office 格式（Word / Excel）──
# 这一段推翻了 F2 §5.1 原来那句「PDF 以外的格式不做」。推翻的理由不是
# 「做起来不难」，是目标场景变了：制造业的 SOP 在 Word、BOM 与检验记录在
# Excel，只收 PDF 等于把最想问的那批资料挡在门外。
# 边界仍在（§5.1 已改）：图片、网页、.doc/.xls 旧二进制格式照旧不做，
# 理由是它们要么需要 OCR/渲染，要么需要 antiword/LibreOffice 这类外挂。
#
# 三条设计约束写在这里，因为它们是判据的共同前提：
# ① 归一化成 list[str]（「段」）——切块/索引/检索/引用四处一行不改
# ② 分派按后缀，不嗅探魔数——docx 与 xlsx 都是 zip，嗅探要多解一层而结论相同
# ③ 失败仍走 DocumentErrorCode，不新开一套码

