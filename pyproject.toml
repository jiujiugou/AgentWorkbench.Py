[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentworkbench"
version = "0.0.0"
description = "面向企业团队的多用户 AI 知识工作台（C# 版重写）"
requires-python = ">=3.12"
# 这一组就是 F2 §2 组件表。**写了不用会被 deptry 抓到（DEP002），
# 不在表里却用了也会被抓到（DEP001）**——组件表从此不是文档，是依赖声明。
dependencies = [
    "sqlite-vec>=0.1.9",   # vec0 虚表：不装它连 count(*) 都报 no such module
    "huey>=3.5",           # 解析队列：重试退避 + 周期任务（V-7 的定时扫描靠它）
    "alembic>=1.20",       # 迁移：一条 initial 从现状反推，之后逐条追加
    "sqlalchemy>=2.0",     # alembic 的迁移环境直接 import 它的连接对象
    "pypdf>=6.21",         # PDF 抽取：页码是引用的锚点
    "python-docx>=1.2",    # Word 抽取：段落与表格按文档流顺序读（顺序靠 body 遍历，不靠两个 API 各读一遍）
    "openpyxl>=3.1",       # Excel 抽取：read_only 流式读 + merged_cells 精确填合并区域
    "fastapi>=0.115",      # HTTP 契约与 OpenAPI（F6 §2.1 已定，前端移植的前提）
    "uvicorn>=0.34",       # ASGI 运行时：只当启动命令用，不被业务代码 import
    "pydantic>=2.10",      # 只在 api 层做 DTO（camelCase 出网）；core 用 dataclass
    "pydantic-settings>=2.7",  # 配置唯一入口：缺项按类型报错，不变成 None
    "python-multipart>=0.0.20",  # fastapi 解析 multipart 上传的运行时依赖，本仓不直接 import
    "llama-index-core>=0.14",  # 切块：SentenceSplitter 800/120，T-001 定案（11 组里唯一追平 C# 基线）
    "openai>=1.100",  # 模型调用：OpenAI 兼容协议（C# ChatClientFactory 同构，base_url 覆盖切供应商）
    "cryptography>=45",  # Fernet：api_key 库内密文（F6 §1.5①）；密钥从环境变量派生，明文不落库
    "httpx>=0.27",  # HTTP 客户端：smoke 脚本（REQ-17 的验收物）与供应商连通性探测（F6 §2.1）
    "starlette>=0.41",  # 直接 import 的 ASGI 原语（MutableHeaders / 类型）：request_id 中间件用
    "pwdlib[argon2]>=0.2",  # 口令哈希（F1）：argon2id + verify_and_update，参数调高后登录时平滑重哈希
]

# ─────────────────────────────────────────────────────────────
# 组件决定表
# ─────────────────────────────────────────────────────────────
# 这里记的是「已经决定用什么」，机器读得懂，所以能被强制。
# 四条规则由 tests/test_gates.py::test_component_table_matches_dependencies 执行：
#   ① adopted 的包，必须在 [project].dependencies 里（定了不用 = 红）
#   ② dependencies 里的包，必须在这里且是 adopted（用了没定 = 红）
#   ③ rejected 的包，src/ 里不许 import（偷偷用被否掉的东西 = 红）
#   ④ rejected 的条目必须在 reason 里写出重开条件（"为什么不用"不许只是一句话，
#      也就没有下文了——没有重开条件的拒绝，半年后没人敢动它）
# planned 表示「批准了但还没接」，此时不许出现在 dependencies，也不许 import。
#
# ── 什么算「该用库」（2026-11-04 定，F1 讨论的结果）──
# 判据只有一条：**这件事在行业里有没有标准形态。**
#   有标准形态 → 用库。口令哈希、加密、迁移、HTTP 框架、解析器都属此类；
#                自己写等于把安全边界建立在自己写的密码学/协议实现上。
#   没标准形态 → 不假装用库。本项目的授权与隔离（"这条消息属于哪个团队"、
#                "删除时哪些行必须一起消失"）不在任何库的视野里——它们由**你的
#                表结构**决定。硬塞一个框架进来，得到的是"框架 + 仍然手写的 16 项"，
#                外加一层与现有裸 sqlite3 并存的存储习语。
# 所以这张表里 adopted 与 rejected 都是结论，不是偏好；每条 rejected 都要能回答
# "什么条件下我会重新考虑它"。
[[tool.agentworkbench.component]]
capability = "向量存储"
package = "sqlite-vec"
modules = ["sqlite_vec"]
status = "adopted"

[[tool.agentworkbench.component]]
capability = "解析队列"
package = "huey"
modules = ["huey"]
status = "adopted"

[[tool.agentworkbench.component]]
capability = "迁移"
package = "alembic"
modules = ["alembic"]
status = "adopted"

[[tool.agentworkbench.component]]
capability = "迁移环境的连接"
package = "sqlalchemy"
modules = ["sqlalchemy"]
status = "adopted"
# 这条不是「我们决定用 ORM」，是「alembic 的 env.py 要一个连接对象」——
# 两者差别很大：业务读写路径刻意继续用裸 sqlite3 + 手写 SQL，因为 65 处仓储
# 函数、`conn` 第一参数的统一签名是一整套习语，混进 ORM 就是两套。
# 这条边界由 test_scoped_components_are_only_imported_where_allowed 守着。
allowed_in = ["src/agentworkbench/db/migrations/"]
reason = "只用于 alembic 迁移环境（`db/migrations/env.py` 建连接与 pool）。**业务路径不用**：SQL 的形态由表结构决定，不由库决定，换成 Core 写出来还是同样几条 join 与 where；而代价是两套存储习语并存，或一次性迁移全部仓储与 500 条测试。重开条件：换成 PostgreSQL 时工具链会一并带进来，届时整体重估——本仓另有 `postgresql` 一条记着那条路的完整取舍。"

[[tool.agentworkbench.component]]
capability = "PDF 抽取"
package = "pypdf"
modules = ["pypdf"]
status = "adopted"

[[tool.agentworkbench.component]]
capability = "Word 抽取"
package = "python-docx"
modules = ["docx"]
status = "adopted"

[[tool.agentworkbench.component]]
capability = "Excel 抽取"
package = "openpyxl"
modules = ["openpyxl"]
status = "adopted"

[[tool.agentworkbench.component]]
capability = "凭据列加密"
package = "cryptography"
modules = ["cryptography"]
status = "adopted"
reason = "F6 §1.5①：api_key 库内密文（Fernet，密钥从 AWB_SECRET_KEY 派生）。手搓 XOR 流加密等于把「备份文件被拷走」这条防线建立在自己写的密码学上——那正是组件表存在的理由。"

[[tool.agentworkbench.component]]
capability = "HTTP 客户端"
package = "httpx"
modules = ["httpx"]
status = "adopted"
reason = "F6 §2.1：smoke 脚本（REQ-17 的验收物，scripts/smoke.py）与供应商连通性探测。同步 requests 在 async 路径上会卡事件循环（代码规范 §4.1），httpx 两边都有。"

[[tool.agentworkbench.component]]
capability = "ASGI 原语"
package = "starlette"
modules = ["starlette"]
status = "adopted"
reason = "fastapi 的地基，request_id 中间件直接 import 它的 MutableHeaders 与 ASGI 类型——直接用了就声明，不藏在传递依赖里。"

[[tool.agentworkbench.component]]
capability = "HTTP 服务"
package = "fastapi"
modules = ["fastapi"]
status = "adopted"
reason = "F6 §2.1：路由 + 请求校验 + OpenAPI 一体；换 Flask 等于放弃类型契约。"

[[tool.agentworkbench.component]]
capability = "ASGI 运行时"
package = "uvicorn"
modules = []
status = "adopted"
reason = "只当启动命令，不被 import；deptry DEP002 豁免已注明。"

[[tool.agentworkbench.component]]
capability = "请求/响应模型"
package = "pydantic"
modules = ["pydantic"]
status = "adopted"
reason = "只在 api 层出 camelCase DTO；core 保持 dataclass，校验库不进核心。"

[[tool.agentworkbench.component]]
capability = "配置"
package = "pydantic-settings"
modules = ["pydantic_settings"]
status = "adopted"
reason = "REQ-22：缺项按类型报错。手写 os.environ 会静默用错值。"

[[tool.agentworkbench.component]]
capability = "multipart 上传解析"
package = "python-multipart"
modules = []
status = "adopted"
reason = "fastapi 的 UploadFile 必需运行时依赖，在其内部 import；本仓不直接用。"

# ─────────────────────────────────────────────────────────────
# 验证登记表（F2 §四 的机器可读版）
# ─────────────────────────────────────────────────────────────
# 文档管「为什么」，这张表管「验到哪了」。四条规则由
# tests/test_gates.py::test_verification_table_matches_tests 执行：
#   ① F2 的 V-1~V-12 与 F3 的 G1~G15 一条不能少（悄悄删掉一条 = 漏验）
#   ② status=pass 的条目，tests 列的每个 `文件::函数` 必须真实存在
#      —— 测试被删了、改名了、跳过了，这里当场红
#   ③ partial 必须写 remaining（还差什么）；fail 必须写 reason（为什么没过）；
#      manual 必须写 evidence（人工怎么验、验没验）
#   ④ 每条必须有 claim（正控判据）与 negative（负控判据）——
#      F2 §四的原话：写不出反例的断言不要写
#
# status 取值：pass（有测试且全套绿）/ partial（部分）/ fail（验了没过）/ manual（只能人工）。
# 改 status = 宣布一项验证结论变了，会出现在 diff 里，必须能说出理由。
[[tool.agentworkbench.verification]]
id = "V-1"
req = "REQ-05"
claim = "传一份 PDF → 202、列表一行、磁盘恰好一个文件"
negative = "同一文件传两次：documents 恰好 1 行、磁盘恰好 1 份；删掉唯一索引后必须变 2 行（证明去重是约束在起作用，不是先查再插）"
status = "pass"
tests = [
    "tests/invariants/test_ingest_pipeline.py::test_upload_returns_pending_not_parsed",
    "tests/invariants/test_ingest_pipeline.py::test_duplicate_upload_reuses_row_and_one_file_on_disk",
    "tests/invariants/test_ingest_pipeline.py::test_unique_index_is_what_actually_dedupes",
]

